<div class="desktopContainer">
    <div
        class="desktopIcons"
        (pointerdown)="selectionStart($event)"
        (pointermove)="selectionMove($event)"
        (pointerup)="selectionEnd($event)"
        (pointermove)="drag($event)"
        (pointerup)="stopDrag2($event)"
    >
        @for(icon of icons; track $index){
            <app-desktop-icon
                [iconDetails]="icon"
                (clicked)="newWindow(icon.wType)"
                (selected)="icon.selected = !icon.selected"
                (pointerdown)="startDrag($event, $index)"
            ></app-desktop-icon>
        }
        @if(selection.visible){
            <div
                class="selectionRectangle"
                [style.left.px]="selection.left"
                [style.top.px]="selection.top"
                [style.width.px]="selection.width"
                [style.height.px]="selection.height">
            </div>
        }
    </div>
    <div class="desktop">
        @for (window of windows; track $index) {
            @if(!window.isMinimized){
                <app-window
                [window]="window"
                [index]="$index"
                (focused)="focusCallback($event)"
                (draggedToTop)="dragIndCallback($event)"
                (closed)="closeWindowCallback($event);"
                [isFocused]="window.zIndex === getMaxWindowZindex()"
            ></app-window>
            }
        }
    </div>
    <div class="desktopToolbar">
        @if(showStartMenu){
            <app-start-menu
                (openAboutWindowClicked)="newWindow(wType.me)"
                (openFileExplorerWindowClicked)="newWindow(wType.dir)"
                (openSettingsWindowClicked)="newWindow(wType.gear)"
                (openTerminalWindowClicked)="newWindow(wType.term)"
                (rebootClicked)="newWindow(wType.off)"
                (pointerdown)="$event.stopPropagation()"
            ></app-start-menu>
        }
        <div
            class="noselect startMenuBtn"
            (click)="toggleStartMenu()"
            (pointerdown)="$event.stopPropagation()"
            role="button"
            [class.startMenuBtnFocused]="showStartMenu"
        >Start</div>
        @for (window of windows; track $index) {
            <div class="toolbarIcon" (click)="focusCallback($index)" [class.toolbarIconFocused]="window.zIndex === getMaxWindowZindex()">
                <div
                    [class.iconGear]="window.icon === 'gear'"
                    [class.iconDir]="window.icon === 'dir'"
                    [class.iconMe]="window.icon === 'me'"
                    [class.iconTerm]="window.icon === 'term'"
                    [class.iconIn]="window.icon === 'in'"
                    [class.iconNet]="window.icon === 'net'"
                    [class.iconOff]="window.icon === 'off'"
                ></div>
            </div>
        }
        <div class="right">
            <div>{{ clock }}</div>
        </div>
    </div>
    @if(showFullscreenIndicator){
        <div class="fullscreenIndicator"></div>
    }
</div>
