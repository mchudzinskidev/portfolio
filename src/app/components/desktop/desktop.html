<div class="desktopContainer">
    <div class="desktop">
        @for (window of windows; track $index) {
            <app-window [window]="window" [index]="$index" (focused)="focusCallback($event)" (draggedToTop)="dragIndCallback($event)"></app-window>
        }
    </div>
    <div class="desktopToolbar">
        <div>
            <div (click)="newWindow()">+</div>
        </div>
        <div class="right">
            <div>{{ clock }}</div>
        </div>
    </div>
    @if(showFullscreenIndicator){
        <div class="fullscreenIndicator"></div>
    }
</div>
